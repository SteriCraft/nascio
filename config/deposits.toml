# Catalogue des gisements de Nascio (spec §4.6).
#
# Le code ne connaît que les contextes et les formes ; chaque type est décrit ici. Le fichier est
# copié dans le monde à la génération (deposits.toml) et son hachage entre dans l'empreinte :
# le modifier ne change jamais un monde existant.
#
# Champs :
#   name        identifiant unique
#   label       nom affiché (légende de la carte)
#   map_color   couleur de la carte des gisements [r, g, b]
#   blocks      blocs du minerai : { block = nom, color = [r, g, b], share = part, density = kg/m³ }
#               (aucun bloc : carte seulement, forme "trap")
#   cap         couche d'un autre bloc au toit d'une couche : { block, color, fraction, density }
#   contexts    poids par contexte : ocean, ridge, trench, arc, orogen, rift, hotspot, ophiolite,
#               ultramafic, craton, platform, basin (à terre et en mer), marine_shelf,
#               passive_margin, humid, arid, laterite, tropical, river_source, coast.
#               Poids d'une cellule = Σ poids × contexte
#   requires    contextes requis (le poids est multiplié par chacun) ; "a|b" : le plus grand
#               des deux
#   shape       vein (filon), stock (amas porphyrique), lens (lentille), layer (couche),
#               blanket (manteau d'altération), placer, trap (piège, carte seulement)
#   host        pour une couche : "sediment" (défaut) ou "basement"
#   host_rock   facultatif : roches (noms de blocs) que le corps peut remplacer, en plus de ce
#               que permet sa forme ; par exemple le silex dans "limestone" et "chalk"
#   depth_m     profondeur du centre sous la surface rocheuse [min, max]
#               (couche en socle : sous la couverture sédimentaire)
#   size_m      longueur ou diamètre [min, max]
#   thickness_m épaisseur [min, max] (filons, couches, manteaux, placers ; amas et lentilles :
#               hauteur)
#   grade       part des blocs minéralisés au cœur du corps (0..1)
#   abundance   corps par 100 km² de contexte de poids 1 (rareté) ; absent pour un type posé
#               au-dessus d'un autre
#   above       facultatif : type (plus haut dans ce fichier) sur les corps duquel ce type est
#               posé, centré, au lieu d'être tiré par tuile ; par exemple le chapeau de cuivre
#               oxydé au-dessus d'un porphyre
#   probability avec above : chance qu'un corps du type parent en reçoive un (0..1), multipliée
#               par le poids des contextes de ce type à sa position
#   max_temperature_c  facultatif : roche la plus chaude où le corps peut commencer (°C) ; la
#               plage de profondeur se resserre au-dessus de cet isotherme de la colonne
#   elements    à titre indicatif : éléments obtenus après raffinage (sous-produits compris)

