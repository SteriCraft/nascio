[package]
name = "nascio-server"
description = "Nascio authoritative server: QUIC, tick, chunk columns, edits and their journal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[features]
# The window: map, console, measurements and players (`--nogui` runs without it). A server
# without a display can be built with `--no-default-features`.
default = ["gui"]
gui = ["dep:bevy", "dep:bevy_egui", "dep:nascio-worldgen"]

[dependencies]
nascio-core.workspace = true
nascio-world.workspace = true
nascio-voxel.workspace = true
nascio-protocol.workspace = true
serde.workspace = true
toml.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
quinn.workspace = true
rcgen.workspace = true
rayon.workspace = true
argon2.workspace = true
ring.workspace = true
postcard.workspace = true
rand.workspace = true
rand_chacha.workspace = true
socket2.workspace = true
bevy = { workspace = true, optional = true }
bevy_egui = { workspace = true, optional = true }
nascio-worldgen = { workspace = true, optional = true }

[dev-dependencies]
nascio-worldgen.workspace = true
nascio-client.workspace = true

[lints]
workspace = true
